# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
# Secrets must be created first: firebase apphosting:secrets:set <SECRET_NAME>
env:
  # Firebase Client SDK (public keys, stored as secrets for portability)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID

  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    secret: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID

  # Non-secret config (plain values)
  - variable: NEXT_PUBLIC_BASE_URL
    value: https://aprendeswift.dev
    availability:
      - BUILD
      - RUNTIME

  - variable: SENDGRID_FROM_EMAIL
    value: noreply@aprendeswift.dev
    availability:
      - RUNTIME

  - variable: SENDGRID_FROM_NAME
    value: aprendeSwift
    availability:
      - RUNTIME

  - variable: CONTACT_EMAIL
    value: contacto@aprendeswift.dev
    availability:
      - RUNTIME

  - variable: OPENAI_MODEL
    value: gpt-3.5-turbo
    availability:
      - RUNTIME

  - variable: OPENAI_TEMPERATURE
    value: "0.7"
    availability:
      - RUNTIME

  - variable: OPENAI_MAX_TOKENS
    value: "500"
    availability:
      - RUNTIME

  # Server-side secrets (stored in Google Cloud Secret Manager)
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID

  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL

  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY

  - variable: SENDGRID_API_KEY
    secret: SENDGRID_API_KEY

  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
